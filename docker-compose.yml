services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: genomics
      POSTGRES_USER: genomics
      POSTGRES_PASSWORD: genomics
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genomics -d genomics"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["genomics_pgdata:/var/lib/postgresql/data"]
volumes:
  genomics_pgdata:
