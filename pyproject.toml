[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genomic-data-integration-platform"
version = "0.1.0"
description = "Multi-source genomics ETL, canonical data model, and REST/GraphQL/SOAP APIs."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.115",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "strawberry-graphql[fastapi]>=0.250",
  "typer>=0.12",
  "uvicorn[standard]>=0.30",
  "tenacity>=9.0",
  "orjson>=3.10",
  "spyne>=2.14.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]
data = ["polars>=1.6", "pyarrow>=17.0"]
orchestration = ["dagster>=1.8", "dagster-webserver>=1.8"]

[project.scripts]
genomic-platform = "genomic_platform.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requires a dedicated PostgreSQL test database"]

[tool.ruff]
line-length = 100
